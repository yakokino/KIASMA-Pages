<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="KIASMA公式サイト">
    <title>KIASMA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="home">
        <h1 class="logo-frame image-frame" data-placeholder="KIASMA LOGO">
            <img
                class="logo"
                src="assets/kiasma-logo.png"
                alt="KIASMA"
                width="360"
                height="390"
            >
        </h1>

        <div class="visual-frame image-frame" data-placeholder="MAIN VISUAL">
            <img
                class="main-visual"
                src="assets/home-visual.jpg"
                alt="KIASMAのメインビジュアル"
                width="2400"
                height="1228"
            >
        </div>

        <nav class="primary-nav" aria-label="メインナビゲーション">
            <a href="about/">about us</a>
            <a href="games/">games</a>
            <a href="https://www.instagram.com/kiasma_official/" target="_blank" rel="noopener noreferrer">instagram</a>
            <a href="https://x.com/necky_kiasma" target="_blank" rel="noopener noreferrer">X</a>
        </nav>
    </main>

    <script>
        document.querySelectorAll(".image-frame img").forEach((image) => {
            const frame = image.closest(".image-frame");

            const showPlaceholder = () => frame.classList.add("is-missing");
            const showImage = () => frame.classList.remove("is-missing");

            image.addEventListener("error", showPlaceholder);
            image.addEventListener("load", showImage);

            if (image.complete) {
                image.naturalWidth ? showImage() : showPlaceholder();
            }
        });
    </script>
</body>
</html>
